# One-click cloud deployment on Render (https://render.com) — free tier.
# New + > Blueprint > select this repository.
services:
  - type: web
    name: foodiebot
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CONFIDENCE_THRESHOLD
        value: "0.30"
      - key: RATE_LIMIT_PER_MIN
        value: "30"
